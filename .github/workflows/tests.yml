name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # dvisvgm is built against libkpathsea and searches a real TeX Live
      # font/map database for the Computer Modern fonts our equations use
      # (cmr, cmmi, ...) — apt's dvisvgm package doesn't pull one in, so
      # without texlive-fonts-recommended it logs "no font file found" and
      # silently emits <use> refs to glyphs it never defined. ghostscript
      # provides libgs.so, which dvisvgm needs (via LIBGS, see
      # _dvisvgm_env() in s08a_svg_render.py) to trace those Type1 outlines
      # to paths once it can find them.
      - name: Install system dependencies (dvisvgm, ghostscript, texlive fonts, poppler)
        run: |
          sudo apt-get update
          sudo apt-get install -y dvisvgm ghostscript texlive-latex-base texlive-fonts-recommended poppler-utils

      # tectonic isn't packaged for Ubuntu's apt; install the pinned release
      # binary directly rather than piping the upstream install script to sh.
      - name: Install tectonic
        run: |
          curl -fsSL -o tectonic.tar.gz \
            "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-gnu.tar.gz"
          tar xzf tectonic.tar.gz
          sudo mv tectonic /usr/local/bin/
          tectonic --version

      - name: Install Python dependencies
        run: pip install -r kindle_math_converter/requirements-ci.txt

      # TEMP DEBUG — remove once s08a renders cleanly in CI. Reproduces a
      # single equation render directly so we get dvisvgm's real stderr,
      # instead of guessing from the pipeline's swallowed failure_reason.
      - name: Debug dvisvgm render
        run: |
          ldconfig -p | grep -i libgs || echo "no libgs in ldconfig cache"
          python - <<'PY'
          import subprocess
          import tempfile
          from pathlib import Path
          from kindle_math_converter.stages.s08a_svg_render import latex_to_xdv, _dvisvgm_env, _find_binary
          from kindle_math_converter.models.enums import FormulaClass

          with tempfile.TemporaryDirectory() as tmpdir:
              work = Path(tmpdir)
              xdv = latex_to_xdv("E=mc^2", FormulaClass.INLINE, work, timeout=30)
              print("xdv ok:", xdv, xdv.stat().st_size, "bytes")

              print("--- Tectonic cache tree, now that a compile has happened ---")
              cache = Path.home() / ".cache" / "Tectonic"
              for p in sorted(cache.rglob("*"))[:200]:
                  print(p)

              print("--- font file extensions under cache ---")
              exts = {}
              for p in cache.rglob("*"):
                  if p.is_file():
                      exts[p.suffix] = exts.get(p.suffix, 0) + 1
              for ext, count in sorted(exts.items(), key=lambda kv: -kv[1]):
                  print(ext or "(no ext)", count)

              env = _dvisvgm_env()
              print("LIBGS =", env.get("LIBGS"))
              print("TEXFONTS =", env.get("TEXFONTS"))

              svg_path = work / "equation.svg"
              result = subprocess.run(
                  [_find_binary("dvisvgm"), "--no-fonts", "--exact-bbox", "--precision=4",
                   "--bbox=min", f"--output={svg_path}", str(xdv)],
                  capture_output=True, timeout=30, cwd=work, env=env,
              )
              print("dvisvgm returncode:", result.returncode)
              print("dvisvgm stdout:", result.stdout.decode(errors="replace"))
              print("dvisvgm stderr:", result.stderr.decode(errors="replace"))
              print("svg content:")
              print(svg_path.read_text() if svg_path.exists() else "(no file produced)")
          PY

      # epubcheck (Java) is deliberately not installed here: the fast test
      # suite runs with epubcheck_enabled=False, and s10_epub_assembly
      # already degrades gracefully (logs + skips) when it's absent.
      - name: Run fast test suite
        run: pytest -m "not slow"
